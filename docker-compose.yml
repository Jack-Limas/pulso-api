# Development: `docker compose up -d` starts only PostgreSQL and Redis.
# Full demo: `docker compose --profile demo up -d --build` adds the AI service over native gRPC,
# two API instances and nginx in front of them. It expects pulso-ai cloned next to this repo
# and the secrets below in a local .env file.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  ai:
    profiles: [demo]
    build: ../pulso-ai
    environment:
      PORT: "50051"
      INTERNAL_API_KEY: ${AI_INTERNAL_KEY:?set AI_INTERNAL_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  # Runs once, before either instance starts, so two instances never migrate at the same time.
  migrate:
    profiles: [demo]
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulso:pulso@postgres:5432/pulso
      DIRECT_DATABASE_URL: postgresql://pulso:pulso@postgres:5432/pulso

  api-a: &api
    profiles: [demo]
    build: .
    command: ["node", "dist/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    environment: &api-env
      INSTANCE_ID: api-a
      PORT: "8080"
      DATABASE_URL: postgresql://pulso:pulso@postgres:5432/pulso
      DIRECT_DATABASE_URL: postgresql://pulso:pulso@postgres:5432/pulso
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:50051
      AI_TRANSPORT: grpc
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:?set AI_INTERNAL_KEY in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: development

  api-b:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api-b

  nginx:
    profiles: [demo]
    image: nginx:1.29-alpine
    depends_on: [api-a, api-b]
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres-data:
