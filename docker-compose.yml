services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
      POSTGRES_DB: pulso
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
